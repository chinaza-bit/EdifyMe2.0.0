<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">

  <!-- 1. Background circle -->
  <circle cx="120" cy="120" r="112" fill="#232244"/>

  <!-- 2. Cross (two thick round-capped strokes) -->
  <line x1="120" y1="46"  x2="120" y2="102" stroke="#D9A441" stroke-width="16" stroke-linecap="round"/>
  <line x1="98"  y1="74"  x2="142" y2="74"  stroke="#D9A441" stroke-width="16" stroke-linecap="round"/>

  <!-- 3. Letter E (four thick round-capped strokes) -->
  <line x1="66" y1="112" x2="66"  y2="188" stroke="#FBF7EF" stroke-width="14" stroke-linecap="round"/>
  <line x1="66" y1="112" x2="108" y2="112" stroke="#FBF7EF" stroke-width="14" stroke-linecap="round"/>
  <line x1="66" y1="150" x2="98"  y2="150" stroke="#FBF7EF" stroke-width="14" stroke-linecap="round"/>
  <line x1="66" y1="188" x2="108" y2="188" stroke="#FBF7EF" stroke-width="14" stroke-linecap="round"/>

  <!-- 4. Letter M (one continuous zigzag stroke) -->
  <polyline points="124,188 124,112 152,150 180,112 180,188"
            fill="none" stroke="#FBF7EF" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>

</svg>
